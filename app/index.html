<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#05070f">
  <title>별을 세어 은하를 그리다</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.min.js",
      "three/addons/": "./vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
  <main id="app">
    <section id="view">
      <canvas id="c"></canvas>
      <div id="meteors"></div>
      <img id="ground" src="./img/ground.webp" alt="" hidden>
      <img id="observer" src="./img/observer.webp" alt="" hidden>
      <div id="reticle" hidden></div>
      <p id="hint"></p>
      <p id="status" hidden></p>
      <div id="actions">
        <button id="aim-btn" class="primary" hidden></button>
        <button id="phase-btn" class="primary" hidden></button>
        <button id="skip-btn" hidden></button>
      </div>
      <div id="toggles" hidden>
        <label><input type="checkbox" id="tg-stars"> <span data-text="toggleStars"></span></label>
        <label><input type="checkbox" id="tg-surface" checked> <span data-text="toggleSurface"></span></label>
        <label><input type="checkbox" id="tg-markers" checked> <span data-text="toggleMarkers"></span></label>
      </div>
      <div id="eyepiece" hidden>
        <div class="ep-body">
          <canvas id="ep-canvas"></canvas>
          <div class="ep-side">
            <p id="ep-title"></p>
            <p id="ep-count" class="big"></p>
            <p id="ep-msg"></p>
            <button id="ep-auto" class="primary" hidden></button>
            <button id="ep-done" class="primary" hidden></button>
          </div>
        </div>
      </div>
    </section>

    <aside id="panel">
      <header>
        <h1 data-text="title"></h1>
        <button id="restart-btn" class="small" data-text="restart"></button>
      </header>
      <div id="map-area">
        <div id="map-box"><canvas id="map"></canvas></div>
        <div id="record"></div>
        <p id="progress"></p>
      </div>
      <div id="quiz" hidden></div>
    </aside>
  </main>

  <!-- 첫 화면 -->
  <div id="intro" class="story-page">
    <img class="story-bg" src="./img/landing.webp" alt="">
    <div class="story-text intro-text">
      <p class="story-sub" data-text="subtitle"></p>
      <h2 class="story-title" data-text="title"></h2>
      <p class="story-question" data-text="question"></p>
      <p class="story-note" data-text="introNote"></p>
      <button id="start-btn" class="story-btn" data-text="start"></button>
    </div>
    <p class="story-credit" data-text="credit"></p>
  </div>

  <!-- 마지막 화면(문제를 다 푼 뒤) -->
  <div id="ending" class="story-page" hidden>
    <img class="story-bg" src="./img/ending.webp" alt="">
    <div class="story-text ending-text">
      <h2 class="story-title" data-text="endingTitle"></h2>
      <p class="story-question" data-text="endingSub"></p>
      <button id="again-btn" class="story-btn" data-text="restartAll"></button>
    </div>
    <p class="story-credit" data-text="credit"></p>
  </div>

  <!-- 별을 다 세면 지도가 화면 가운데로 크게 나와 깊이를 찍는다 -->
  <div id="pick-overlay" hidden>
    <p id="pick-banner"></p>
    <div class="pick-body">
      <div id="pick-slot"></div>
      <div id="pick-hint">
        <p id="pick-hint-text"></p>
        <canvas id="pick-hint-canvas"></canvas>
      </div>
    </div>
  </div>

  <div id="tutorial" class="overlay" hidden>
    <div class="tut">
      <header>
        <span id="tut-step"></span>
        <h2 id="tut-title"></h2>
        <button id="tut-skip" class="small"></button>
      </header>
      <div class="tut-body">
        <canvas id="tut-canvas"></canvas>
        <div class="tut-side">
          <p id="tut-text"></p>
          <div id="tut-choices"></div>
          <p id="tut-note"></p>
          <button id="tut-next" class="primary" hidden></button>
        </div>
      </div>
    </div>
  </div>

  <div id="rotate" class="overlay"><p>📱↻ <span data-text="rotateDevice"></span></p></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
